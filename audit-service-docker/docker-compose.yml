name: audit-service

services:

  postgres:
    image: postgres:16-alpine
    container_name: audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kgadmin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgadmin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - audit-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: audit-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - audit-net

  # NOTE: audit-service no longer validates JWTs locally — it calls
  # IAM (PLAT-001) /api/v1/auth/verify synchronously per spec §3.5.1/§3.8.
  # Keycloak is started here for completeness but audit-service itself
  # does not talk to it directly; only IAM does.
  audit-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL_TEMPLATE: jdbc:postgresql://postgres:5432/{tenant}_audit
      DB_USERNAME: kgadmin
      DB_PASSWORD: secret
      KAFKA_SERVERS: kafka:9092
      IAM_SERVICE_URL: http://iam-service:8084
      APP_TENANTS: tenant_kgh,tenant_kgsc
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - audit-net
      - pista-shared

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: audit-kafka-ui
    restart: unless-stopped
    ports:
      - "8100:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: audit-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - audit-net

volumes:
  postgres-data:
  kafka-data:

networks:
  audit-net:
    driver: bridge
  pista-shared:
    external: true
    name: pista-shared-net
