spring:
  application:
    name: audit-service

  datasource:
    url-template: jdbc:postgresql://10.100.13.3:5434/{tenant}
    username: kghparas
    password: kghparas
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false # Disables eager startup metadata queries
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false


  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

kafka:
  topics:
    order-audit: cpoe.order.audit

app:
  tenants: ${APP_TENANTS:tenant_kgh,tenant_kgsc}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true


logging:
  level:
    com.kghospital.audit: INFO

services:
  iam:
    base-url: ${IAM_SERVICE_URL:http://iam-service:8084}


resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        iam-introspection:
          failure-rate-threshold: 50
          wait-duration-in-open-state: 20s
          sliding-window-size: 10
          minimum-number-of-calls: 5


