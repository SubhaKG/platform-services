name: form-builder-service

services:

  postgres:
    image: postgres:16-alpine
    container_name: formbuilder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kgadmin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgadmin"]
      interval: 10s
      retries: 10
    networks:
      - formbuilder-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: formbuilder-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9097
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9097
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9097:9097"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      retries: 10
    networks:
      - formbuilder-net

  # Calls iam-service synchronously for JWT introspection and
  # audit-service for submission audit forwarding. Start both first.
  form-builder-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: form-builder-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL_TEMPLATE: jdbc:postgresql://postgres:5432/{tenant}_formbuilder
      DB_USERNAME: kgadmin
      DB_PASSWORD: secret
      KAFKA_SERVERS: kafka:9092
      IAM_SERVICE_URL: http://iam-service:8084
      AUDIT_SERVICE_URL: http://audit-service:8081
      APP_TENANTS: tenant_kgh,tenant_kgsc
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      retries: 5
      start_period: 90s
    networks:
      - formbuilder-net
      - pista-shared

volumes:
  postgres-data:
  kafka-data:

networks:
  formbuilder-net:
    driver: bridge
  pista-shared:
    external: true
    name: pista-shared-net
