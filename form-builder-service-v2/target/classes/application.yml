spring:
  application:
    name: form-builder-service
  datasource:
    url-template: jdbc:postgresql://10.100.13.3:5434/{tenant}
    username: kghparas
    password: kghparas
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false   # TenantFlywayMigrationRunner handles per-tenant
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topics:
    form-published: cpoe.form.published                                   # legacy
    submission-created-pattern: "%s.platform.form.submission.created"     # PLAT-004 §3.6.2

services:
  iam:
    base-url: ${IAM_SERVICE_URL:http://iam-service:8084}
  audit:
    base-url: ${AUDIT_SERVICE_URL:http://audit-service:8081}

app:
  tenants: ${APP_TENANTS:tenant_kgh,tenant_kgsc}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      iam-introspection:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        sliding-window-size: 10
        minimum-number-of-calls: 5
      plat002-audit:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 5
        minimum-number-of-calls: 3

logging:
  level:
    com.kghospital.forms: INFO
    com.kghospital.formbuilder: INFO
