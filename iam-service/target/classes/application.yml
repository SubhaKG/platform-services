spring:
  application:
    name: iam-service
  datasource:
    url-template: jdbc:postgresql://10.100.13.3:5434/{tenant}_iam
    username: kghparas
    password: kghparas
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false   # ProgrammaticMigrationRunner handles per-tenant
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://keycloak:8080/realms/pista/protocol/openid-connect/certs}

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:pista}
  client-id: ${KEYCLOAK_CLIENT_ID:iam-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:iam-secret}
  service-account:
    client-id: ${KEYCLOAK_SA_CLIENT_ID:iam-service-account}
    client-secret: ${KEYCLOAK_SA_CLIENT_SECRET:iam-sa-secret}

services:
  audit:
    base-url: ${AUDIT_SERVICE_URL:http://audit-service:8081}

app:
  tenants: ${APP_TENANTS:tenant_kgh,tenant_kgsc}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      plat002-audit:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 5
        minimum-number-of-calls: 3

logging:
  level:
    com.kghospital.iam: INFO
