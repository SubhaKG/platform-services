spring:
  application:
    name: notification-escalation-service
  datasource:
    url-template: jdbc:postgresql://10.100.13.3:5434/{tenant}
    username: kghparas
    password: kghparas
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false   # per-tenant runner handles migration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: notification-escalation-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

kafka:
  topics:
    # NEW engine — {tenant}.platform.notification.{entity}.{event}
    dispatch-pattern: "+.platform.notification.alert.dispatch"
    acknowledged-pattern: "%s.platform.notification.alert.acknowledged"
    escalated-pattern: "%s.platform.notification.alert.escalated"
    deadletter-pattern: "%s.platform.notification.alert.deadletter"
    # LEGACY engine
    domain-events: pista.domain.events,pista.workflow.state-changed
    escalation-triggered: pista.escalation.triggered

escalation:
  processor:
    interval-ms: 60000   # legacy generic escalation — run every minute

services:
  iam:
    base-url: ${IAM_SERVICE_URL:http://iam-service:8084}
  prm:
    base-url: ${PRM_SERVICE_URL:http://prm-service:8200}
  audit:
    base-url: ${AUDIT_SERVICE_URL:http://audit-service:8081}

channels:
  sms:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  whatsapp:
    twilio:
      bsp-token: ${TWILIO_WHATSAPP_BSP_TOKEN:}
  email:
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
  push:
    fcm:
      server-key: ${FCM_SERVER_KEY:}

app:
  tenants: ${APP_TENANTS:tenant_kgh,tenant_kgsc}

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      iam-introspection:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        sliding-window-size: 10
        minimum-number-of-calls: 5
      prm-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 5
        minimum-number-of-calls: 3

logging:
  level:
    com.kghospital.notification: INFO
    com.kghospital.escalation: INFO
