name: workflow-sm-service

services:

  postgres:
    image: postgres:16-alpine
    container_name: workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kgadmin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgadmin"]
      interval: 10s
      retries: 10
    networks:
      - workflow-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: workflow-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9095
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9095:9095"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      retries: 10
    networks:
      - workflow-net

  # NOTE: workflow-sm-service no longer validates JWTs locally — it calls
  # IAM (PLAT-001) /api/v1/auth/verify synchronously per PLAT-003 spec
  # §3.4.4 / integration table. Keycloak itself is not contacted directly
  # by this service; only IAM talks to Keycloak.
  workflow-sm-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow-sm-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL_TEMPLATE: jdbc:postgresql://postgres:5432/{tenant}_workflow
      DB_USERNAME: kgadmin
      DB_PASSWORD: secret
      KAFKA_SERVERS: kafka:9092
      IAM_SERVICE_URL: http://iam-service:8084
      APP_TENANTS: tenant_kgh,tenant_kgsc
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      retries: 5
      start_period: 90s
    networks:
      - workflow-net
      - pista-shared

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: workflow-kafka-ui
    ports:
      - "8101:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: workflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - workflow-net

volumes:
  postgres-data:
  kafka-data:

networks:
  workflow-net:
    driver: bridge
  pista-shared:
    external: true
    name: pista-shared-net
